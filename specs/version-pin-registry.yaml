# .factory/specs/version-pin-registry.yaml
# Source of truth for canonical current version per versioned artifact.
#
# REGISTRY UPDATE OBLIGATION (ADR-0007 §Version-Pin Registry):
#   State-manager MUST update this registry in the SAME commit as any document version bump.
#   Registry and document are atomic (Single-Commit Burst Protocol applies).
#
# FORMAT:
#   <artifact-id>:
#     path: <path relative to .factory/ root for spec docs, or relative to workspace root for code>
#     current_version: "<semver or semantic version>"
#     last_bump_commit: "<full SHA>"
#     last_bump_date: "<ISO-8601 date>"
#
# HOW TO ADD A NEW ENTRY:
#   1. Add a block using the artifact's canonical ID (filename without .md for docs).
#   2. Set path relative to .factory/ for spec docs, or workspace root for code files.
#   3. Set current_version to the `version:` field from the document's YAML frontmatter.
#   4. Set last_bump_commit and last_bump_date to the factory-artifacts commit that introduced
#      the current version. Use `git -C .factory log --format="%H %as" -- <path> | head -1`.
#
# HOW TO UPDATE ON VERSION BUMP:
#   When state-manager bumps a document's version:
#     1. Update current_version to the new version string.
#     2. Update last_bump_commit to the current commit SHA (use $(git rev-parse HEAD) in script).
#     3. Update last_bump_date to today's date.
#   This update MUST be in the same commit as the document version bump.
#
# ARTIFACT IDs:
#   SS-* docs: use the filename without .md (e.g., "SS-tui" for SS-tui.md)
#   BC files: use "BC-N.NN.NNN" format matching the file basename without .md
#   ADR files: use "ADR-NNNN" format
#   Other docs: use the filename without .md
#
# CI LINT:
#   scripts/check_version_pins.py reads this registry to verify active version-pin literals.
#   An active version-pin literal is one NOT classified as a historical anchor per
#   ADR-0007 §Historical Anchor Classification:
#     - NOT inside a ## §Trace section
#     - NOT annotated with # version-pin-historical or <!-- version-pin-historical -->
#     - NOT containing a time qualifier ("at time of", "at S-NNN authoring time", etc.)
#
# EXEMPT PATHS (not scanned by CI lint):
#   .factory/cycles/     — closed adversarial cycle records; sealed at closure
#   target/              — cargo build output
#   .git/                — git internals
#   node_modules/        — not applicable

