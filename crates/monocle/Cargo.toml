[package]
name = "monocle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "monocle CLI — daemon lifecycle subcommands (start, stop)."

[lints]
workspace = true

[[bin]]
name = "monocle"
path = "src/main.rs"

[[bin]]
name = "test-stubborn-daemon"
path = "src/bin/test_stubborn_daemon.rs"

# Library target so that integration tests in tests/ can access pub items
# from modules like auto_start without going through the binary entry point.
[lib]
name = "monocle"
path = "src/lib.rs"

[dependencies]
monocle-runtime = { path = "../monocle-runtime" }
clap = { workspace = true, features = ["derive"] }
nix = { workspace = true, features = ["signal", "process"] }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
# tokio: required for auto_start_daemon() async polling loop (S-019, BC-2.04.002 PC-4).
tokio = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = { workspace = true }
tokio = { workspace = true }
# temp-env: test-only env var isolation for MONOCLE_NO_AUTOSTART tests (BC-2.04.003).
# Declared inline (NOT workspace = true) per least-privilege dev-dependency policy
# (same pattern as monocle-runtime).  The `async_closure` feature is required for
# `temp_env::async_with_vars` used in tokio test bodies.
# SS-deps-pin-manifest.md v1.2.0 §Dev Dependencies.
temp-env = { version = "0.3", features = ["async_closure"] }
