[package]
name = "monocle-session-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Per-session supervisor process: owns PTY master, vt100 parser, harness child handle, and per-session UDS socket (S-033)."

[lints]
workspace = true

[[bin]]
name = "monocle-session-host"
path = "src/main.rs"

[dependencies]
# PTY stack (v1A additions per SS-deps-pin-manifest-v2-delta.md §New Crates)
portable-pty  = "0.9"
vt100         = "0.16"

# Workspace dependencies
tokio         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
nix           = { workspace = true, features = ["process", "signal", "user"] }
thiserror     = { workspace = true }
tracing       = { workspace = true }
chrono        = { workspace = true }
uuid          = { workspace = true }

# IPC wire types (SessionState, DaemonToHost, HostToDaemon, SerializedCell)
monocle-ipc   = { path = "../monocle-ipc" }

# Structured logging for session-host process (stderr; not shared with daemon runtime).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Atomic sidecar writes (no naked std::fs::write — CLAUDE.md conventions).
tempfile      = { workspace = true }

[dev-dependencies]
# tokio with test-util feature: required for tokio::time::pause()/advance() in
# kill_sequence SIGKILL-escalation tests (BC-2.08.003 AC-003, MED-002).
# test-util is NOT in the workspace "full" feature set — must be explicitly added
# for dev-builds. Pattern from monocle-runtime/Cargo.toml (established precedent).
tokio = { workspace = true, features = ["test-util"] }
# CR-003: serial_test required to prevent parallel interference on tests that
# mutate the SIGTERM_TIMEOUT_MS global (AtomicU64 package-level mutable state
# per SS-conventions-anti-patterns.md). The SIGKILL escalation test and any test
# that relies on SIGTERM_TIMEOUT_MS being at its production default (10_000ms)
# must be annotated with #[serial_test::serial] to run serially.
serial_test = "3"
