[package]
name = "monocle-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "monocle TUI binary — terminal user interface for the monocle session manager"

# Binary target: monocle-tui is the effectful TUI binary.
# The crate also exposes a lib target (default for Cargo) so that integration
# tests in tests/ can import app::App and apply_permission_prompt_queued.
[[bin]]
name = "monocle-tui"
path = "src/main.rs"

[dependencies]
# TUI / terminal rendering — effectful boundary (SS-tui.md)
ratatui = { workspace = true }
crossterm = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Structured logging (tracing for events; tracing-subscriber for subscriber init in binary)
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling (anyhow for binary crate)
anyhow = { workspace = true }

# Workspace crates
monocle-core = { path = "../monocle-core" }
monocle-config = { path = "../monocle-config" }
monocle-ipc = { path = "../monocle-ipc" }

# uuid for PromptModal.prompt_id
uuid = { workspace = true }

# directories: resolve XDG runtime dir for UDS socket path (same as monocle-config)
directories = { workspace = true }

# serde_json for stub types
serde_json = { workspace = true }

# nucleo: fuzzy matcher for the sessions filter panel (BC-2.06.006, S-028).
# Caret pin: 0.5. Architecture compliance: ONLY in monocle-tui — NEVER monocle-core
# (purity boundary per S-028 §Forbidden Dependencies + SS-tui.md §Dependency Graph).
# ADR-0002 (nucleo dormancy risk) accepted with explicit re-eval trigger at TD-001.
nucleo = "0.5"

# similar: unified diff for ToolPayload::Edit (AC-005, BC-2.06.015).
# ONLY in monocle-tui — NEVER monocle-core (purity boundary, AC-007 / BC-2.06.015 INV-1).
similar = "3"

# unicode-width: compute display column width for VISUAL overflow detection in
# render_generic_payload (BC-2.06.024 PC-3 / AC-006 / F-S027-P3-NIT-001).
# Production code needs this to estimate wrapped rows for the scroll-hint predicate.
# Same minor pin (0.2) as the dev-dep consumed transitively by ratatui.
unicode-width = "0.2"

# chrono for uptime formatting (started_at → elapsed duration)
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
# unicode-width is now a normal [dependencies] entry (promoted for production use in
# render_generic_payload wrap-aware overflow detection — F-S027-P3-NIT-001).
# The dev-dep entry is removed to avoid the duplicate; tests use the production dep.
# temp-env: safe env-var isolation in tests (sync/async); required by Semgrep rule
# monocle-no-raw-env-mutation-in-tests (SS-conventions-anti-patterns.md §Test Conventions).
# NOT workspace = true per SS-deps-pin-manifest.md §Dev Dependencies (least-privilege).
temp-env = { version = "0.3", features = ["async_closure"] }

[lints]
workspace = true
