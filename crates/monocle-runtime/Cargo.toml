[package]
name = "monocle-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Runtime daemon for monocle: hook ingestion, session lifecycle, auth, ring buffer."

[features]
# E2E test affordances — test-only delay injection for drain-timeout tests.
# MUST NOT be enabled in production builds. Only enabled by the E2E test binary target
# via the test target's invocation: `cargo test --features e2e-test-affordances`.
# When this feature is active, MONOCLE_HOOK_DELAY_MS env var is read and the outer
# handler sleep is compiled in. When absent (production), neither is compiled.
# HIGH-1 fix (SS-daemon-wiring-impl.md §Fix Addendum Round 2 HIGH-1).
e2e-test-affordances = []

[lints]
workspace = true

[[bin]]
name = "monocle-runtime"
path = "src/main.rs"

[dependencies]
monocle-core = { path = "../monocle-core" }
monocle-ipc = { path = "../monocle-ipc" }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# tracing-subscriber: fmt subscriber initialization in the daemon binary entry point.
# Resolves ADV-W4GATE-MED-002 (no subscriber → daemon errors invisible in logs).
# env-filter feature required for RUST_LOG / tracing_subscriber::EnvFilter support.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = { workspace = true }
constant_time_eq = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
directories = { workspace = true }
nix = { workspace = true, features = ["signal", "process"] }
axum = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# temp-env: test-only; declared inline (NOT workspace = true) per story AC-006.
# Required for BC-ENGINE-002-ERR test isolation using async_with_vars.
# SS-deps-pin-manifest.md v1.2.0 §Dev Dependencies.
temp-env = { version = "0.3", features = ["async_closure"] }
syn = { workspace = true }
# tower + http-body-util: axum integration test helpers (ServiceExt::oneshot, BodyExt::collect).
# Established pattern in monocle-test-harness/tests/; workspace-declared per SS-deps-pin-manifest.
tower = { workspace = true }
http-body-util = { workspace = true }
# regex-lite: lightweight regex for semver-format assertions in test bodies.
# Test-only; NOT in workspace.dependencies (least-privilege: this is the only consumer).
# regex-lite is the stdlib-like minimal regex crate without Unicode tables.
regex-lite = "0.1"
# tracing-test: structured log capture for AC-006 / BC-2.03.003 PC-2 E-ENG-001 assertions.
# Test-only; NOT in workspace.dependencies (least-privilege: only this crate uses it for log capture).
# `no-env-filter` feature required: integration tests in tests/ are a separate crate from the
# implementation, so without no-env-filter the subscriber only captures the test crate's own
# logs — not the monocle-runtime logs being tested. See tracing-test docs §"Per-crate Filtering".
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
# ureq: minimal synchronous HTTP client for E2E binary tests (daemon_e2e_serve.rs).
# Test-only; the E2E test uses blocking HTTP calls to probe the live daemon.
# Version 2.x chosen for simple API without async overhead in test context.
ureq = { version = "2", features = ["json"] }
# libc: POSIX signal constants (SIGTERM) for kill() in E2E test shutdown assertion.
# Test-only; production code uses nix for signal handling.
libc = "0.2"
