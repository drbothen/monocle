[package]
name = "monocle-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Runtime daemon for monocle: hook ingestion, session lifecycle, auth, ring buffer."

[lints]
workspace = true

[[bin]]
name = "monocle-runtime"
path = "src/main.rs"

[dependencies]
monocle-core = { path = "../monocle-core" }
monocle-proto = { path = "../monocle-proto" }
tokio = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
constant_time_eq = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
directories = { workspace = true }
nix = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# temp-env: test-only; declared inline (NOT workspace = true) per story AC-006.
# Required for BC-ENGINE-002-ERR test isolation using async_with_vars.
# SS-deps-pin-manifest.md v1.1.19 §Dev Dependencies.
temp-env = { version = "0.3", features = ["async_closure"] }
syn = { workspace = true }
# tower + http-body-util: axum integration test helpers (ServiceExt::oneshot, BodyExt::collect).
# Established pattern in monocle-test-harness/tests/; workspace-declared per SS-deps-pin-manifest.
tower = { workspace = true }
http-body-util = { workspace = true }
# reqwest: HTTP client for real-TCP integration tests (AC-006 100ms timing probe).
# EXACT-pinned via workspace.dependencies per SS-deps-pin-manifest.md v1.1.19 §Patch-Pinning Policy.
# Features: json (response.json()) + default features (includes rustls/native-tls via default).
reqwest = { workspace = true, features = ["json"] }
# regex-lite: lightweight regex for semver-format assertions in test bodies.
# Test-only; NOT in workspace.dependencies (least-privilege: this is the only consumer).
# regex-lite is the stdlib-like minimal regex crate without Unicode tables.
regex-lite = "0.1"
