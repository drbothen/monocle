name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # allow manual re-runs (e.g., after a transient infra failure)

# Cancel in-progress runs on new pushes to the same ref (saves minutes on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions principle: each workflow declares the least scope it needs.
# This block sets the default for every job; individual jobs may narrow further.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Disable incremental compilation in CI -- faster cold cache, smaller artifact size.
  CARGO_INCREMENTAL: 0

jobs:
  # Fast pre-flight gate: lint-toolchain + fmt + clippy before spinning the full matrix.
  preflight:
    name: Preflight (toolchain + fmt + lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v4 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Lint toolchain pin (AC-004)
        # Asserts rust-toolchain.toml exists at workspace root AND pins channel "1.88".
        # Bumped from 1.86 → 1.88 by RUSTSEC-2026-0009 Path B resolution (time 0.3.47 requires 1.88).
        run: |
          set -euo pipefail
          test -f rust-toolchain.toml
          grep -Eq '^channel = "1\.88"$' rust-toolchain.toml

      - name: Install Rust toolchain (rust-toolchain.toml drives version)
        # dtolnay/rust-toolchain@v1 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.88"
          components: clippy, rustfmt

      - name: Cache cargo
        # Swatinem/rust-cache@v2 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: preflight

      - name: Install protoc (monocle-proto prost-build dependency)
        # protobuf-compiler on ubuntu-24.04 ships protoc 3.21.x, compatible with prost-build =0.14.1.
        # Required because prost-build invokes the protoc binary at compile time; it is NOT bundled.
        # ubuntu-24.04 runner images no longer pre-install protoc as of image 20260525.161+.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: cargo fmt --all --check
        run: |
          set -euo pipefail
          cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings

  # Semgrep gate: fixture corpus assertion + production scan + audit-table gap check.
  # Runs after preflight (Rust toolchain ready), before build-and-test.
  # CI step ordering per SS-conventions-anti-patterns.md §CI Wiring: fmt → clippy → semgrep → test → deny → audit.
  semgrep:
    name: Semgrep (anti-pattern enforcement)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v4 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install semgrep
        run: |
          set -euo pipefail
          pip install semgrep --quiet

      - name: Step 1 — Fixture corpus scan (positive-coverage assertion)
        # Validates that each semgrep rule fires at least the expected number of times
        # against its fixture. A count mismatch means the rule is silently broken.
        # Expected counts per SS-conventions §Semgrep Coverage Hardening fixture table:
        #   monocle-no-shell-injection              → 2
        #   monocle-no-naked-fs-write               → 2
        #   monocle-no-unbounded-channel            → 2  (basic + turbofish arms)
        #   monocle-no-raw-env-mutation-in-tests    → 4
        #   monocle-non-exhaustive-struct-audit-completeness → 2
        # If Step 1 fails, Steps 2 and 3 are skipped to avoid misleading results.
        run: |
          set -euo pipefail
          SEMGREP_JSON=$(semgrep --config .semgrep.yml --json semgrep-fixtures/)

          check_count() {
            local rule_id="$1"
            local expected="$2"
            local fixture_path="$3"
            local actual
            actual=$(echo "$SEMGREP_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          count = sum(1 for r in data.get('results', []) if r.get('check_id') == '$rule_id')
          print(count)
          ")
            if [ "$actual" -eq "$expected" ]; then
              echo "Fixture corpus: ${actual} violation(s) detected for rule ${rule_id} (expected ${expected}) — PASS"
            else
              echo "Fixture corpus: ${actual} violation(s) detected for rule ${rule_id} (expected ${expected}) — FAIL: verify ${fixture_path} contains all required pattern arms"
              exit 1
            fi
          }

          check_count "monocle-no-shell-injection"                         2  "semgrep-fixtures/shell_injection.rs"
          check_count "monocle-no-naked-fs-write"                          2  "semgrep-fixtures/naked_fs_write.rs"
          check_count "monocle-no-unbounded-channel"                       2  "semgrep-fixtures/unbounded_channel.rs"
          check_count "monocle-no-raw-env-mutation-in-tests"               4  "semgrep-fixtures/tests/raw_env_mutation.rs"
          check_count "monocle-non-exhaustive-struct-audit-completeness"   2  "semgrep-fixtures/non_exhaustive_struct.rs"

      - name: Step 2 — Production scan (zero-findings assertion)
        # Scans production source only (crates/). semgrep-fixtures/ excluded.
        # monocle-non-exhaustive-struct-audit-completeness uses severity: WARNING and is
        # intentionally excluded from the zero-findings check (Step 3 handles it).
        # --error causes semgrep to exit non-zero if any ERROR-severity rule fires.
        run: |
          set -euo pipefail
          semgrep --config .semgrep.yml --error \
            --include="crates/**/*.rs" \
            --exclude-rule="monocle-non-exhaustive-struct-audit-completeness" \
            crates/

      - name: Step 3 — Audit-table gap check
        # Runs the Python audit script to verify every #[non_exhaustive] pub struct in
        # production code appears in the vendored scripts/audit-table.md (synced from
        # SS-engine-module.md §Cross-Crate Constructor Audit Table).
        # VENDORING RATIONALE: .factory/ is a git worktree on the factory-artifacts orphan branch;
        # actions/checkout on develop/PR refs does NOT materialize it. Vendoring avoids a dual-
        # checkout workaround and makes audit-table changes explicit at PR review time.
        # SYNC POLICY: whenever SS-engine-module.md audit-table section changes, scripts/audit-table.md
        # MUST be updated in the same PR. See scripts/audit-table.md header for details.
        run: |
          set -euo pipefail
          SEMGREP_JSON_FILE=$(mktemp /tmp/semgrep-audit-XXXXXXXX.json)
          trap 'rm -f "$SEMGREP_JSON_FILE"' EXIT
          semgrep --config .semgrep.yml --json \
            --include="crates/**/*.rs" \
            --include="semgrep-fixtures/**/*.rs" \
            crates/ semgrep-fixtures/ \
            > "$SEMGREP_JSON_FILE"
          [ -s "$SEMGREP_JSON_FILE" ] || { echo "::error::Semgrep produced empty output"; exit 1; }
          python3 scripts/check_audit_table.py \
            --semgrep-json "$SEMGREP_JSON_FILE" \
            --spec-file scripts/audit-table.md \
            --rule-id monocle-non-exhaustive-struct-audit-completeness

  # Audit-table vendor drift check.
  # Checks out the factory-artifacts branch at a known path, extracts the canonical
  # Cross-Crate Constructor Audit Table block from SS-engine-module.md using
  # scripts/extract_audit_table.py, then diffs the extracted block against the vendored
  # scripts/audit-table.md delimited section.
  #
  # RATIONALE: scripts/audit-table.md was vendored because .factory/ is a git worktree on
  # factory-artifacts and is NOT materialized by actions/checkout on develop/PR refs. The
  # drift check closes the loop: PR authors are no longer the last line of defence against
  # stale vendored copies.
  #
  # continue-on-error: false — the delimiters exist in both files (verified locally). Any
  # diff failure means the vendored copy has silently diverged and MUST be corrected before
  # merge. If factory-artifacts is unreachable (rare network failure), the job will fail with
  # a clear Git error rather than silently passing.
  audit-table-drift:
    name: Audit-table vendor drift check
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (PR ref)
        # actions/checkout@v4 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Checkout factory-artifacts spec
        # Checks out factory-artifacts into .factory-spec/ so SS-engine-module.md is reachable.
        # actions/checkout@v4 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: factory-artifacts
          path: .factory-spec

      - name: Extract canonical audit-table block from SS-engine-module.md
        run: |
          set -euo pipefail
          python3 scripts/extract_audit_table.py \
            --source .factory-spec/specs/architecture/SS-engine-module.md \
            --output /tmp/audit-table-canonical.md

      - name: Extract vendored audit-table block from scripts/audit-table.md
        # Extract only the delimited section from the vendored file so the diff compares
        # the same region (the header lines in scripts/audit-table.md are intentionally
        # absent from the canonical extraction).
        run: |
          set -euo pipefail
          python3 scripts/extract_audit_table.py \
            --source scripts/audit-table.md \
            --output /tmp/audit-table-vendored.md

      - name: Diff vendored vs canonical
        run: |
          set -euo pipefail
          if ! diff -u /tmp/audit-table-canonical.md /tmp/audit-table-vendored.md \
               > /tmp/audit-drift.diff; then
            echo "::error file=scripts/audit-table.md::audit-table.md has drifted from canonical \
          SS-engine-module.md §Cross-Crate Constructor Audit Table"
            echo ""
            echo "Diff (canonical vs vendored):"
            cat /tmp/audit-drift.diff
            echo ""
            echo "Fix: regenerate scripts/audit-table.md by running:"
            echo "  python3 scripts/extract_audit_table.py \\"
            echo "    --source .factory/specs/architecture/SS-engine-module.md \\"
            echo "    --output /tmp/audit-table-new.md"
            echo "Then copy the extracted block (replacing lines from <!-- BEGIN ... --> through"
            echo "<!-- END ... --> in scripts/audit-table.md) and commit in the same PR."
            exit 1
          fi
          echo "::notice::audit-table.md matches canonical SS-engine-module.md §Cross-Crate Constructor Audit Table"

  # POL-11 + POL-12 enforcement: version-pin literal freshness + structural-claim freshness.
  # Runs after preflight (in parallel with semgrep and audit-table-drift).
  # CI step ordering per SS-conventions-anti-patterns.md §CI Wiring.
  #
  # POL-11 (ADR-0007): verifies every active version-pin literal in .md/.rs/.toml/.yml/.yaml
  #   files matches the canonical version in .factory/specs/version-pin-registry.yaml.
  #
  # POL-12 Phase 1 (ADR-0008): verifies App struct field type-identifier claims in
  #   .factory/stories/*.md Tasks checklists + Downstream Consumer Contract blocks match
  #   canonical SS-tui.md §App struct declarations.
  #
  # Both scripts read from factory-artifacts (checked out at .factory-spec/).
  # No Rust toolchain required — pure Python with stdlib only.
  pol-lint:
    name: POL-11 + POL-12 (version-pin + structural-claim freshness)
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (PR ref)
        # actions/checkout@v4 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Checkout factory-artifacts spec
        # Checks out factory-artifacts into .factory-spec/ so version-pin-registry.yaml
        # and story files are accessible. Same pattern as audit-table-drift job.
        # actions/checkout@v4 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: factory-artifacts
          path: .factory-spec

      - name: POL-11 — version-pin literal freshness (monocle-version-pin-freshness)
        # Verifies every active version-pin literal (SS-X.md vN.M, BC-N.N.N vN.M, ADR-NNNN vN.M)
        # in .md, .rs, .toml, .yml, .yaml files matches the registry current_version.
        # Active = not in §Trace section, not annotated # version-pin-historical, no time qualifier.
        # Exit 1 on any stale active pointer. Exit 0 on all-current or all-historical.
        run: |
          set -euo pipefail
          python3 scripts/check_version_pins.py \
            --factory-root .factory-spec \
            --workspace-root .

      - name: POL-12 Phase 1 — structural-claim freshness (monocle-structural-claim-check)
        # Verifies App struct field type-identifier claims in story Tasks checklists and
        # Downstream Consumer Contract code blocks match canonical SS-tui.md §App struct.
        # Phase 1 scope: .factory/stories/*.md only. Phase 2 (doc-comment tables) deferred
        # to Phase 5 per ADR-0008 §Implementation Plan.
        # Exit 1 on any stale active structural claim. Exit 0 on all-canonical or all-historical.
        run: |
          set -euo pipefail
          python3 scripts/check_structural_claims.py \
            --factory-root .factory-spec \
            --workspace-root .

  # Per-platform build + test matrix. Explicit `include:` -- NOT a Cartesian product
  # (matches story AC-003 exactly).
  build-and-test:
    name: Build + Test (${{ matrix.runner }} / ${{ matrix.target }})
    needs: [semgrep, audit-table-drift, pol-lint]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        # actions/checkout@v4 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain (${{ matrix.target }})
        # dtolnay/rust-toolchain@v1 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.88"
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Cache cargo
        # Swatinem/rust-cache@v2 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: ${{ matrix.target }}

      - name: Install protoc (monocle-proto prost-build dependency)
        # prost-build =0.14.1 requires the protoc binary at compile time; it is NOT bundled.
        # Ubuntu: protobuf-compiler 3.21.x (apt); macOS: protobuf via Homebrew (includes protoc).
        # ubuntu-24.04 runner images no longer pre-install protoc as of image 20260525.161+.
        run: |
          set -euo pipefail
          if [ "$(uname)" = "Darwin" ]; then
            brew install protobuf
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends protobuf-compiler
          fi

      # --locked rejects an out-of-date Cargo.lock. A drifted lockfile is a
      # security smell -- it can silently re-resolve to an unaudited version.
      - name: cargo build --workspace --locked --target ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --workspace --locked --target ${{ matrix.target }}

      - name: cargo test --workspace --locked --target ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo test --workspace --locked --target ${{ matrix.target }}

  # cargo-deny gate: license policy, banned crates, active RUSTSEC advisories, non-registry sources.
  # Runs after build-and-test per §CI Wiring step ordering (test → deny → audit).
  # Uses deny.toml at workspace root per SS-conventions §deny.toml configuration.
  cargo-deny:
    name: cargo deny (license + bans + advisories)
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: cargo deny check
        # EmbarkStudios/cargo-deny-action@v2 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        # arguments: is pre-command per action.yml input ordering — produces:
        #   cargo-deny --log-level warn --manifest-path ./Cargo.toml --workspace --all-features check all
        # --workspace + --all-features required so feature-gated transitive deps (tokio<1.52,
        # russh<0.60, openssl) are included in ban evaluation. Without them, bans miss deps
        # that are only reachable under non-default features.
        uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1
        with:
          log-level: warn
          command: check all
          arguments: --workspace --all-features

  # cargo-audit gate: runs on every PR for fast feedback. The scheduled deep-scan
  # lives in audit.yml (weekly cron).
  # Runs after cargo-deny per §CI Wiring step ordering.
  audit-on-pr:
    name: cargo audit (PR gate)
    needs: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain@v1 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.88"

      - name: Cache cargo
        # Swatinem/rust-cache@v2 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: audit

      # Prefer pre-built cargo-audit binary over source compile -- shaves ~90s per run.
      # Falls through to source install if no binary release matches the runner.
      - name: Install cargo-audit (prebuilt)
        # taiki-e/install-action@v2 — pinned to SHA (supply-chain security; SS-conventions §R-001)
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468
        with:
          tool: cargo-audit

      - name: Run cargo audit
        # --deny warnings escalates every advisory (including unmaintained, yanked,
        # informational) to a CI failure. New advisories block merge until either
        # the version is patched OR a documented risk-acceptance is filed under
        # .factory/specs/risk-acceptance/.
        run: |
          set -euo pipefail
          cargo audit --deny warnings
