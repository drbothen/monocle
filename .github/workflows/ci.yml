name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on new pushes to the same ref (saves minutes on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Disable incremental compilation in CI -- faster cold cache, smaller artifact size.
  CARGO_INCREMENTAL: 0

jobs:
  # Fast pre-flight gate: lint-toolchain + fmt before spinning the full matrix.
  preflight:
    name: Preflight (toolchain + fmt + lint)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint toolchain pin (AC-004)
        # Asserts rust-toolchain.toml exists at workspace root AND pins channel "1.86".
        run: |
          set -euo pipefail
          test -f rust-toolchain.toml
          grep -Eq '^channel = "1\.86"$' rust-toolchain.toml

      - name: Install Rust toolchain (rust-toolchain.toml drives version)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: preflight

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Per-platform build + test matrix. Explicit `include:` -- NOT a Cartesian product
  # (matches story AC-003 exactly).
  build-and-test:
    name: Build + Test (${{ matrix.runner }} / ${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: cargo build --workspace --target ${{ matrix.target }}
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: cargo test --workspace --target ${{ matrix.target }}
        run: cargo test --workspace --target ${{ matrix.target }}

  # cargo-audit gate: runs on every PR for fast feedback. The scheduled deep-scan
  # lives in audit.yml (weekly cron).
  audit-on-pr:
    name: cargo audit (PR gate)
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.86

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings
