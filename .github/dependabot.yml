# Dependabot configuration for the monocle workspace.
#
# Policy source: .factory/specs/architecture/SS-deps-pin-manifest.md v1.1.18
#                §Security Advisory Response Policy.
#
# Behavior:
# - Patch bumps on caret-pinned library deps: opened weekly. CI runs full
#   matrix + `cargo audit --deny warnings`. On green: auto-merge is permitted
#   (must be explicitly enabled by repo admin via branch protection).
# - EXACT-pinned crates (the 9 security-sensitive crates: tokio, axum,
#   serde_json, rand, prost, reqwest, wasmtime, russh, rmcp): Dependabot DOES
#   propose PRs for `=x.y.z` pins despite the exact version specifier. The
#   `ignore:` block below suppresses these PRs so that security-reviewer agent
#   dispatch is the ONLY path to upgrading EXACT-pinned crates (per
#   SS-deps-pin-manifest v1.1.18 §Patch-Pinning Policy). Manual security-reviewer
#   review is required for any bump to the 9 EXACT-pinned crates.
# - Any minor/major bump anywhere: opened by Dependabot but requires
#   architect + security-reviewer approval (auto-merge BLOCKED).

version: 2
updates:
  # Cargo dependencies (workspace + member crates).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: scope
    # Group minor and patch bumps for low-risk caret-pinned deps into a single
    # PR; majors and security advisories get their own PR for explicit review.
    groups:
      caret-pinned-libs:
        update-types:
          - "minor"
          - "patch"
    # Suppress Dependabot PRs for the 9 EXACT-pinned security-sensitive crates.
    # Dependabot does open PRs for `=x.y.z` pins (contrary to common assumption).
    # These crates require security-reviewer agent dispatch before any version bump;
    # Dependabot automation must not bypass that review gate.
    # Source: SS-deps-pin-manifest.md v1.1.18 §Patch-Pinning Policy.
    ignore:
      - dependency-name: "tokio"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "axum"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "serde_json"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "rand"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "prost"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "reqwest"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "wasmtime"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "russh"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "rmcp"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # GitHub Actions workflow updates.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: scope
