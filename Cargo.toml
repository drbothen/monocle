[workspace]
resolver = "2"
members = [
    "crates/monocle",
    "crates/monocle-config",
    "crates/monocle-core",
    "crates/monocle-ipc",
    "crates/monocle-runtime",
    "crates/monocle-proto",
    "crates/monocle-test-harness",
    "crates/monocle-tui",
    "crates/monocle-session-host",   # NEW v1A (S-033)
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/drbothen/monocle"
authors = ["monocle contributors"]

# Workspace-level dependency declarations per Cargo 2021+ pattern.
# Member crates inherit via `{ workspace = true }`.
# Pin policy source of truth: .factory/specs/architecture/SS-deps-pin-manifest.md v1.2.1
[workspace.dependencies]
# --- EXACT-pinned security-sensitive crates (9 total per SS-deps-pin-manifest v1.2.1 §Patch-Pinning Policy) ---
tokio = { version = "=1.52.0", features = ["full"] }
axum = "=0.8.9"
serde_json = "=1.0.149"
rand = "=0.8.6"
prost = "=0.14.1"
reqwest = "=0.13.0"
wasmtime = "=44.0.1"
russh = "=0.60.2"
# rmcp omitted from Phase 1 workspace per OQ-09 resolution (Phase 4 scope)

# --- TUI / terminal crates (workspace-level so monocle-tui can inherit) ---
# ratatui: default-features disabled to exclude `widget-calendar` (which drags in the `time`
# crate). The calendar widget is not used by monocle-tui. Keeping default-features = false
# reduces compile time and binary size (defense-in-depth). Not a RUSTSEC mitigation — as of
# MSRV bump to 1.88 (Path B), time 0.3.47 is resolved and RUSTSEC-2026-0009 is closed.
# Explicit feature set matches ratatui `default` minus `all-widgets`:
# crossterm backend, underline-color, ratatui-macros, layout-cache.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "macros", "layout-cache"] }
crossterm = "0.29"

# --- Caret-pinned direct workspace deps ---
bytes = "1.11" # Direct pin overrides prost-transitive RUSTSEC-2026-0007; floor = 1.11 per SS-deps-pin-manifest v1.2.1 Option B (fix-from = 1.11.1)
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
nix = "0.30"
constant_time_eq = "0.3"
futures = "0.3"
async-trait = "0.1"
clap = "4.6"
semver = "1"
notify = "8"
serde_yaml_ng = "0.10"
which = "7"
uuid = { version = "1", features = ["v4", "serde"] }
# tower + http-body-util: integration test utilities for axum router testing.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# --- Build dependencies ---
prost-build = "=0.14.1"

# --- Dev dependencies (workspace-declared for inheritance into member [dev-dependencies]) ---
# NOTE: temp-env is intentionally NOT declared here. Story AC-006 requires it in
# monocle-runtime/Cargo.toml [dev-dependencies] only; it is a test-only crate for that
# crate alone. Workspace-level declaration would make it available to all member crates,
# violating the least-privilege principle for dev dependencies.
# See SS-deps-pin-manifest.md v1.2.1 §Dev Dependencies.
syn = { version = "2", features = ["full"] }
# quote: required by monocle-core AST audit tests (VP-019); proc-macro token-stream
# construction for syn 2 round-trip assertions in engine_module_surface.rs.
quote = "1"

[workspace.lints.clippy]
# Lint level: deny disallowed methods (the actual method list lives in clippy.toml
# at the workspace root because Cargo.toml lint config does not accept the
# table-array form for disallowed_methods).
disallowed_methods = "deny"
# Additional defensive lint levels; these are widely useful and not noisy.
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "deny"
# uninlined_format_args: allowed at workspace level because this lint changed from
# `allow` (default pre-1.88) to `warn` (default 1.88+) and the style correction is
# purely cosmetic (no correctness impact). The workspace-wide style migration from
# `format!("... {}", var)` to `format!("... {var}")` will be addressed in a
# dedicated cleanup pass to keep this MSRV bump commit reviewable.
uninlined_format_args = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
